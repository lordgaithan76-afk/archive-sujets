name: Classer les sujets
on:
  push:
    paths: ['sujets/**', 'scripts/generer_sujets.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  classer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generer_sujets.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add sujets-ajouts.js
          git diff --cached --quiet || (git commit -m "Mise à jour du catalogue des sujets" && git push)
