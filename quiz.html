<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Défi du jour et quiz | Archive.Sujets</title>
<meta name="description" content="Un défi de 5 questions chaque jour, des quiz par matière, une série de jours d'affilée et des badges. Gratuit, pour réviser en t'amusant.">
<link rel="canonical" href="https://lordgaithan76-afk.github.io/archive-sujets/quiz.html">
<meta name="theme-color" content="#1B2559">
<style>
:root{--navy:#1B2559;--jaune:#FFD84D;--fond:#F2F5FB;--ligne:#D5DCEB;--muted:#4A5580;--vert:#1f9d55;--rouge:#c62828}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--navy)}
header{background:var(--navy);color:#fff;padding:14px 18px}
header a{color:#fff;text-decoration:none;font-family:Georgia,serif;font-weight:700;font-size:1.25rem}
header span{color:var(--jaune)}
main{max-width:46rem;margin:0 auto;padding:18px}
h1,h2{font-family:Georgia,serif;line-height:1.2}
h2{margin:.1em 0 .4em;font-size:1.25rem}
.note{color:var(--muted)}
.carte{background:#fff;border:1px solid var(--ligne);border-radius:10px;padding:16px;margin:14px 0}
.btn{display:inline-block;background:var(--navy);color:#fff;border:2px solid var(--navy);border-radius:8px;padding:11px 16px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;margin:10px 8px 0 0}
.btn.alt{background:#fff;color:var(--navy)} .btn.vert{background:var(--vert);border-color:var(--vert)}
select{width:100%;font:inherit;padding:10px;border:2px solid var(--ligne);border-radius:8px;background:#fff;color:var(--navy);margin-top:6px}
.serie{background:var(--navy);color:#fff;border-radius:10px;padding:14px;text-align:center}
.serie b{font:700 2.2rem/1.1 Georgia,serif;color:var(--jaune);display:block}
.choix{display:block;width:100%;text-align:left;background:#fff;color:var(--navy);border:2px solid var(--ligne);border-radius:10px;padding:12px 14px;margin:10px 0;font:inherit;cursor:pointer}
.choix.ok{background:#e6f6ec;border-color:var(--vert)} .choix.ko{background:#fdeaea;border-color:var(--rouge)}
.exp{background:#fffbe6;border:1px solid var(--jaune);border-radius:8px;padding:10px 12px;margin:10px 0}
.progres{height:8px;background:var(--ligne);border-radius:4px;overflow:hidden;margin:8px 0 14px}
.progres i{display:block;height:100%;background:var(--navy)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{background:#fff;border:1px solid var(--ligne);border-radius:10px;padding:10px;text-align:center}
.badge.off{opacity:.4;filter:grayscale(1)} .badge .e{font-size:2rem;display:block}
.badge small{display:block;color:var(--muted)}
.barre{height:10px;background:var(--ligne);border-radius:5px;overflow:hidden}
.barre i{display:block;height:100%;background:var(--vert)}
.carres{font-size:1.6rem;letter-spacing:.1em}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><a href="./">Archive<span>.</span>Sujets</a></header>
<main>

<section id="e-accueil">
<p><a href="./" style="color:var(--navy)">← Retour au site</a></p>
<h1>Défi du jour</h1>
<div class="serie" id="a-serie"></div>
<div class="carte"><h2>Le défi d'aujourd'hui</h2><p class="note" id="a-defi"></p><button class="btn vert" id="b-defi" type="button">Relever le défi</button><button class="btn alt" id="b-partage-defi" type="button" hidden>Partager mon résultat</button></div>
<div class="carte"><h2>S'entraîner</h2><label for="a-mat" class="note">Choisis une matière</label><select id="a-mat"></select><button class="btn" id="b-train" type="button">10 questions</button></div>
<div class="carte"><h2>Mes badges</h2><p class="note" id="a-badges"></p><button class="btn alt" id="b-badges" type="button">Voir mes badges et mes progrès</button></div>
<p class="note">Une idée de question ? <a id="a-propose" href="#" style="color:var(--navy)">Envoie-la sur WhatsApp</a>.</p>
</section>

<section id="e-jeu" hidden>
<p class="note" id="j-compteur"></p><div class="progres"><i id="j-barre" style="width:0"></i></div>
<h2 id="j-q"></h2><div id="j-choix"></div><div id="j-exp" class="exp" hidden></div>
<button class="btn vert" id="j-suiv" type="button" hidden>Suivant</button>
</section>

<section id="e-res" hidden>
<h1 id="r-titre"></h1><p class="carres" id="r-carres"></p><p id="r-msg"></p><div id="r-new"></div><div id="r-lien"></div>
<button class="btn vert" id="r-partage" type="button">Partager mon résultat</button><button class="btn alt" id="r-retour" type="button">Retour</button>
</section>

<section id="e-badges" hidden>
<p><a href="#" id="bd-retour" style="color:var(--navy)">← Retour</a></p>
<h1>Mes badges</h1><div class="badges" id="bd-liste"></div>
<div class="carte"><h2>Mes matières</h2><div id="bd-mat"></div><p id="bd-faible" class="note"></p></div>
</section>

</main>
<script src="questions.js"></script>
<script>
const $=i=>document.getElementById(i);
const URL_QUIZ="https://lordgaithan76-afk.github.io/archive-sujets/quiz.html",WA="237673045034";
const ST={get:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
/* ---- fonctions pures (testées) ---- */
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const numJour=s=>{const p=s.split("-");return Math.floor(Date.UTC(+p[0],+p[1]-1,+p[2])/864e5)};
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const melanger=(l,rng)=>{const a=l.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const prep=(q,rng)=>{const ordre=melanger(q.c.map((x,i)=>i),rng);return{m:q.m,q:q.q,e:q.e,c:ordre.map(i=>q.c[i]),r:ordre.indexOf(q.r)}};
const tirageDefi=(Q,date,n)=>{
  const rng=mulberry(numJour(date)),ordre=melanger(Q.map((x,i)=>i),rng),pris=[],mats=new Set();
  ordre.forEach(i=>{if(pris.length<n&&!mats.has(Q[i].m)){mats.add(Q[i].m);pris.push(i)}});
  ordre.forEach(i=>{if(pris.length<n&&!pris.includes(i))pris.push(i)});
  const r2=mulberry(numJour(date)+7);return pris.map(i=>prep(Q[i],r2));
};
const serieEnCours=(jours,today)=>{
  let d=numJour(today),n=0;if(jours[today]===undefined)d--;
  const ok=new Set(Object.keys(jours).map(numJour));while(ok.has(d)){n++;d--}return n;
};
const meilleureSerie=jours=>{const l=[...new Set(Object.keys(jours).map(numJour))].sort((a,b)=>a-b);let b=0,c=0,p=null;l.forEach(x=>{c=(p!==null&&x===p+1)?c+1:1;p=x;if(c>b)b=c});return b};
const BADGES=[
 {id:"debut",e:"🥇",t:"Premier défi",d:"Terminer un défi du jour",ok:s=>Object.keys(s.jours).length>=1},
 {id:"s3",e:"🔥",t:"3 jours d'affilée",d:"Relever le défi 3 jours de suite",ok:s=>meilleureSerie(s.jours)>=3},
 {id:"s7",e:"🚀",t:"7 jours d'affilée",d:"Relever le défi 7 jours de suite",ok:s=>meilleureSerie(s.jours)>=7},
 {id:"sf",e:"💯",t:"Sans faute",d:"5 sur 5 au défi du jour",ok:s=>Object.values(s.jours).some(v=>v>=5)},
 {id:"reg",e:"📅",t:"Régulier",d:"Terminer 10 défis",ok:s=>Object.keys(s.jours).length>=10},
 {id:"cur",e:"📚",t:"Curieux",d:"Répondre à 50 questions",ok:s=>s.total>=50},
 {id:"exp",e:"🧠",t:"Expert",d:"100 bonnes réponses",ok:s=>s.bonnes>=100},
 {id:"tat",e:"🎯",t:"Touche-à-tout",d:"Répondre dans 5 matières",ok:s=>Object.keys(s.mat).length>=5}
];
const gagnes=s=>BADGES.filter(b=>b.ok(s)).map(b=>b.id);
const nouvStats=()=>({total:0,bonnes:0,mat:{},jours:{}});
/* ---- état ---- */
const Q=window.QUESTIONS||[];
let stats=Object.assign(nouvStats(),ST.get("quiz_stats",{}));
let run=null;
const aujour=()=>iso(new Date());
const ecran=n=>["accueil","jeu","res","badges"].forEach(x=>$("e-"+x).hidden=x!==n);
const carres=l=>l.map(x=>x?"🟩":"🟥").join("");
const texteDefi=(sc,rep)=>{const s=serieEnCours(stats.jours,aujour()),d=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"numeric"});
  return "Archive.Sujets · Défi du jour ("+d+")\n"+sc+"/"+rep.length+" "+carres(rep)+(s>1?"\n🔥 "+s+" jours d'affilée":"")+"\nÀ toi de jouer : "+URL_QUIZ};
const partager=async t=>{try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e&&e.name==="AbortError")return}window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank","noopener")};
/* ---- accueil ---- */
const accueil=()=>{
  const s=serieEnCours(stats.jours,aujour()),fait=stats.jours[aujour()];
  $("a-serie").innerHTML="<b>"+(s?"🔥 "+s:"0")+"</b>"+(s>1?"jours d'affilée":s===1?"jour d'affilée":"Lance ta série aujourd'hui !");
  $("a-defi").textContent=fait!==undefined?"Défi terminé aujourd'hui : "+fait+"/5. Reviens demain pour un nouveau défi.":"5 questions dans 5 matières, les mêmes pour tous les élèves aujourd'hui.";
  $("b-defi").hidden=fait!==undefined;$("b-partage-defi").hidden=fait===undefined;
  $("a-badges").textContent=gagnes(stats).length+" badge"+(gagnes(stats).length>1?"s":"")+" sur "+BADGES.length+" · "+stats.total+" question"+(stats.total>1?"s":"")+" répondue"+(stats.total>1?"s":"");
  ecran("accueil");
};
const mats=[...new Set(Q.map(q=>q.m))].sort();
$("a-mat").innerHTML='<option value="">Toutes les matières</option>'+mats.map(m=>"<option>"+m+"</option>").join("");
$("a-propose").href="https://wa.me/"+WA+"?text="+encodeURIComponent("Bonjour, je propose une question pour le quiz d'Archive.Sujets :");
/* ---- jeu ---- */
const demarrer=(mode,qs)=>{run={mode,qs,i:0,rep:[],date:aujour()};montrer()};
const montrer=()=>{
  const q=run.qs[run.i];ecran("jeu");
  $("j-compteur").textContent=(run.mode==="defi"?"Défi du jour":"Entraînement")+" · "+q.m+" · question "+(run.i+1)+"/"+run.qs.length;
  $("j-barre").style.width=(run.i*100/run.qs.length)+"%";$("j-q").textContent=q.q;
  $("j-choix").innerHTML=q.c.map((c,i)=>'<button type="button" class="choix" data-i="'+i+'">'+c.replace(/</g,"&lt;")+"</button>").join("");
  $("j-exp").hidden=true;$("j-suiv").hidden=true;$("j-suiv").textContent=run.i+1<run.qs.length?"Suivant":"Voir mon score";
};
$("j-choix").onclick=e=>{
  const b=e.target.closest(".choix");if(!b||b.disabled)return;
  const q=run.qs[run.i],i=+b.dataset.i,bon=i===q.r;
  [...document.querySelectorAll(".choix")].forEach((x,k)=>{x.disabled=true;if(k===q.r)x.classList.add("ok");else if(k===i)x.classList.add("ko")});
  run.rep.push(bon);$("j-exp").innerHTML=(bon?"<b>Bravo !</b> ":"<b>Pas tout à fait.</b> ")+q.e.replace(/</g,"&lt;");$("j-exp").hidden=false;$("j-suiv").hidden=false;$("j-suiv").focus();
};
$("j-suiv").onclick=()=>{run.i++;run.i<run.qs.length?montrer():fin()};
const fin=()=>{
  const avant=gagnes(stats),sc=run.rep.filter(Boolean).length;
  run.qs.forEach((q,k)=>{const m=stats.mat[q.m]||(stats.mat[q.m]={n:0,ok:0});m.n++;if(run.rep[k])m.ok++});
  stats.total+=run.qs.length;stats.bonnes+=sc;
  if(run.mode==="defi"&&stats.jours[run.date]===undefined)stats.jours[run.date]=sc;
  ST.set("quiz_stats",stats);
  const nv=BADGES.filter(b=>b.ok(stats)&&!avant.includes(b.id));
  run.score=sc;
  const rate={};run.qs.forEach((q,k)=>{if(!run.rep[k])rate[q.m]=(rate[q.m]||0)+1});
  const pire=Object.keys(rate).sort((a,b)=>rate[b]-rate[a])[0]||run.qs[0].m;
  $("r-lien").innerHTML='<a class="btn alt" href="examen-blanc.html?mat='+encodeURIComponent(pire)+'">Passer un vrai sujet de '+pire.replace(/</g,"&lt;")+'</a>';
  $("r-titre").textContent=sc+" sur "+run.qs.length;$("r-carres").textContent=carres(run.rep);
  const p=sc/run.qs.length;$("r-msg").textContent=p===1?"Sans faute, bravo !":p>=.6?"Très bien, continue comme ça.":"Tu progresses : relis les explications et recommence demain.";
  $("r-new").innerHTML=nv.map(b=>'<div class="carte">'+b.e+" <b>Nouveau badge : "+b.t+"</b></div>").join("");
  $("r-partage").textContent=run.mode==="defi"?"Partager mon résultat":"Partager mon score";
  ecran("res");
};
$("r-partage").onclick=()=>partager(run.mode==="defi"?texteDefi(run.score,run.rep):"J'ai fait "+run.score+"/"+run.qs.length+" au quiz d'Archive.Sujets "+carres(run.rep)+"\nÀ toi de jouer : "+URL_QUIZ);
$("r-retour").onclick=accueil;
$("b-defi").onclick=()=>demarrer("defi",tirageDefi(Q,aujour(),5));
$("b-partage-defi").onclick=()=>{const sc=stats.jours[aujour()];partager("Archive.Sujets · Défi du jour : "+sc+"/5"+(serieEnCours(stats.jours,aujour())>1?"\n🔥 "+serieEnCours(stats.jours,aujour())+" jours d'affilée":"")+"\nÀ toi de jouer : "+URL_QUIZ)};
$("b-train").onclick=()=>{const m=$("a-mat").value,pool=Q.filter(q=>!m||q.m===m),rng=Math.random;demarrer("train",melanger(pool,rng).slice(0,10).map(q=>prep(q,rng)))};
/* ---- badges ---- */
$("b-badges").onclick=()=>{
  const g=gagnes(stats);
  $("bd-liste").innerHTML=BADGES.map(b=>'<div class="badge'+(g.includes(b.id)?"":" off")+'"><span class="e">'+b.e+"</span><b>"+b.t+"</b><small>"+b.d+"</small></div>").join("");
  const l=Object.keys(stats.mat).sort();
  $("bd-mat").innerHTML=l.length?l.map(m=>{const x=stats.mat[m],p=Math.round(x.ok*100/x.n);return "<p style='margin:6px 0'>"+m+" · "+p+" % ("+x.n+" question"+(x.n>1?"s":"")+')</p><div class="barre"><i style="width:'+p+'%"></i></div>'}).join(""):'<p class="note">Réponds à quelques questions pour voir tes résultats par matière.</p>';
  const f=l.map(m=>({m,x:stats.mat[m]})).filter(o=>o.x.n>=3).sort((a,b)=>a.x.ok/a.x.n-b.x.ok/b.x.n)[0];
  $("bd-faible").innerHTML=f?'Ta matière à travailler en priorité : <b>'+f.m+'</b>. <a href="plan-revision.html" style="color:var(--navy)">Crée ton plan de révision</a> ou <a href="examen-blanc.html?mat='+encodeURIComponent(f.m)+'" style="color:var(--navy)">passe un vrai sujet</a>.':"";
  ecran("badges");
};
$("bd-retour").onclick=e=>{e.preventDefault();accueil()};
if(!Q.length)document.querySelector("main").insertAdjacentHTML("afterbegin",'<p class="note">Les questions n\'ont pas pu se charger. Vérifie ta connexion et recharge la page.</p>');
accueil();
</script>
</body>
</html>
