name: Mettre à jour la liste des fichiers

on:
  push:
    paths-ignore:
      - documents.json

permissions:
  contents: write

jobs:
  liste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lire les noms de fichiers
        run: |
          python3 - <<'PY'
          import os, re, json, subprocess, unicodedata

          SERIES = {"A", "C", "D", "F4BE", "F4BA", "GT", "MHB"}
          EXAMENS = {"BEPC": "BEPC", "PROBATOIRE": "Probatoire", "BAC": "BAC"}
          MATIERES = {
              "mathematiques": "Mathématiques", "maths": "Mathématiques",
              "physique": "Physique", "chimie": "Chimie",
              "svt": "Sciences de la vie et de la Terre",
              "histoire": "Histoire et géographie", "geographie": "Histoire et géographie",
              "histoire-geo": "Histoire et géographie",
              "philosophie": "Philosophie", "francais": "Français", "anglais": "Anglais",
              "metre": "Métré", "topographie": "Topographie",
              "dessin": "Dessin et lecture de plan",
              "procedes": "Procédés de construction",
              "laboratoire": "Laboratoire", "informatique": "Informatique", "ecm": "ECM",
          }

          def norm(x):
              return unicodedata.normalize("NFD", x).encode("ascii", "ignore").decode().lower()

          pat = re.compile(r"^([^_]+)_([^_]+)_([^_]+)_(.+)\.(pdf|jpe?g|png|webp)$", re.I)
          docs, fiches, rejets = [], [], []
          for f in sorted(os.listdir(".")):
              if not os.path.isfile(f):
                  continue
              m = pat.match(f)
              if not m:
                  if f.count("_") >= 2 and f.lower().endswith((".pdf", ".jpg", ".jpeg", ".png", ".webp")):
                      rejets.append({"f": f, "raison": "le nom ne suit pas SERIE_EXAMEN_MATIERE_Titre"})
                  continue
              s = [x.upper() for x in m.group(1).split("-")]
              if s == ["TOUTES"]:
                  s = ["A", "C", "D", "F4BE", "F4BA"]
              e = [x.upper() for x in m.group(2).split("-")]
              if not all(x in SERIES for x in s):
                  rejets.append({"f": f, "raison": "série inconnue : " + m.group(1)})
                  continue
              if not all(x in EXAMENS for x in e):
                  rejets.append({"f": f, "raison": "examen inconnu : " + m.group(2)})
                  continue
              mat = MATIERES.get(norm(m.group(3)), m.group(3).replace("-", " ").capitalize())
              titre = re.sub(r"[-_]+", " ", m.group(4)).strip()
              titre = titre[:1].upper() + titre[1:]
              r = subprocess.run(["git", "log", "-1", "--format=%ct", "--", f], capture_output=True, text=True)
              try:
                  date = int(r.stdout.strip())
              except ValueError:
                  date = int(os.path.getmtime(f))
              item = {"f": f, "t": titre, "m": mat, "sr": s,
                      "ex": [EXAMENS[x] for x in e],
                      "size": os.path.getsize(f), "date": date}
              (docs if m.group(5).lower() == "pdf" else fiches).append(item)

          with open("documents.json", "w", encoding="utf-8") as out:
              json.dump({"docs": docs, "fiches": fiches, "rejets": rejets}, out, ensure_ascii=False, indent=1)
          print(len(docs), "documents,", len(fiches), "fiches,", len(rejets), "ignorés")
          PY
      - name: Enregistrer la liste
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add documents.json
          git diff --staged --quiet || (git commit -m "Mise à jour de la liste des fichiers" && git push)
