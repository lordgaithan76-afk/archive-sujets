name: Mettre à jour la liste des fichiers

on:
  push:
    paths-ignore:
      - documents.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  liste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lire les noms de fichiers
        run: |
          python3 - <<'PY'
          import os, re, json, subprocess, unicodedata

          SERIES = {"A", "C", "D", "F4BE", "F4BA", "GT", "MHB"}
          EXAMENS = {"BEPC": "BEPC", "PROBATOIRE": "Probatoire", "BAC": "BAC"}
          MATIERES = {
              "mathematiques": "Mathématiques", "maths": "Mathématiques",
              "physique": "Physique", "chimie": "Chimie",
              "svt": "Sciences de la vie et de la Terre",
              "histoire": "Histoire et géographie", "geographie": "Histoire et géographie",
              "histoire-geo": "Histoire et géographie",
              "philosophie": "Philosophie", "francais": "Français", "anglais": "Anglais",
              "metre": "Métré", "topographie": "Topographie",
              "dessin": "Dessin et lecture de plan",
              "procedes": "Procédés de construction",
              "laboratoire": "Laboratoire", "informatique": "Informatique", "ecm": "ECM",
          }

          IMAGES = (".jpg", ".jpeg", ".png", ".webp")
          BUREAU = (".doc", ".docx", ".ppt", ".pptx", ".xls", ".xlsx")
          # Dossiers gérés ailleurs ou techniques : on ne les lit pas
          SAUTER = {".git", ".github", "node_modules", "sujets", "fiches"}
          # Images du site lui-même (icônes, aperçu) : jamais des documents
          SITE = re.compile(r"^(icon|og-image|favicon|logo|apple-touch)", re.I)

          def norm(x):
              return unicodedata.normalize("NFD", x).encode("ascii", "ignore").decode().lower()

          pat = re.compile(r"^([^_]+)_([^_]+)_([^_]+)_(.+)\.(pdf|jpe?g|png|webp)$", re.I)
          docs, fiches, rejets = [], [], []

          def parcourir():
              for racine, dossiers, fichiers in os.walk("."):
                  dossiers[:] = sorted(d for d in dossiers if d not in SAUTER and not d.startswith("."))
                  for nom in sorted(fichiers):
                      yield os.path.relpath(os.path.join(racine, nom), ".").replace(os.sep, "/"), nom

          for chemin, nom in parcourir():
              bas = nom.lower()
              est_pdf = bas.endswith(".pdf")
              est_img = bas.endswith(IMAGES)
              if bas.endswith(BUREAU):
                  rejets.append({"f": chemin, "raison": "format non pris en charge : convertis-le en PDF"})
                  continue
              if not (est_pdf or est_img):
                  continue
              if est_img and SITE.match(nom):
                  continue
              m = pat.match(nom)
              if not m:
                  # un PDF est toujours signalé ; une image seulement si son nom ressemble à un document
                  if est_pdf or nom.count("_") >= 2:
                      rejets.append({"f": chemin, "raison": "le nom ne suit pas SERIE_EXAMEN_MATIERE_Titre (il faut au moins 3 signes _ ; il y en a " + str(nom.count("_")) + ")"})
                  continue
              s = [x.upper() for x in m.group(1).split("-")]
              if s == ["TOUTES"]:
                  s = ["A", "C", "D", "F4BE", "F4BA"]
              e = [x.upper() for x in m.group(2).split("-")]
              if not all(x in SERIES for x in s):
                  rejets.append({"f": chemin, "raison": "série inconnue : " + m.group(1)})
                  continue
              if not all(x in EXAMENS for x in e):
                  rejets.append({"f": chemin, "raison": "examen inconnu : " + m.group(2)})
                  continue
              mat = MATIERES.get(norm(m.group(3)), m.group(3).replace("-", " ").capitalize())
              titre = re.sub(r"[-_]+", " ", m.group(4)).strip()
              titre = titre[:1].upper() + titre[1:]
              r = subprocess.run(["git", "log", "-1", "--format=%ct", "--", chemin], capture_output=True, text=True)
              try:
                  date = int(r.stdout.strip())
              except ValueError:
                  date = int(os.path.getmtime(chemin))
              item = {"f": chemin, "t": titre, "m": mat, "sr": s,
                      "ex": [EXAMENS[x] for x in e],
                      "size": os.path.getsize(chemin), "date": date}
              (docs if m.group(5).lower() == "pdf" else fiches).append(item)

          with open("documents.json", "w", encoding="utf-8") as out:
              json.dump({"docs": docs, "fiches": fiches, "rejets": rejets}, out, ensure_ascii=False, indent=1)
          print(len(docs), "documents,", len(fiches), "fiches,", len(rejets), "ignorés")
          PY
      - name: Enregistrer la liste
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add documents.json
          git diff --staged --quiet || (git commit -m "Mise à jour de la liste des fichiers" && git push)
